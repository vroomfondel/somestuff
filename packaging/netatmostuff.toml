[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somestuff-netatmostuff"
dynamic = ["version"]
description = "Netatmo weather station client (bundles lnetatmo, GPLv3) and MQTT publisher loop for temperature, rain and pressure"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Henning Thieß", email = "ht@xomox.cc" }]
license-files = ["LICENSE.md", "LICENSEGPL.md"]
keywords = ["netatmo", "weather-station", "mqtt", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Home Automation",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "somestuff-corestuff>=0.1.0",
    "loguru>=0.7.3",
    "mqttstuff>=0.0.7",
    "schedule>=1.2",
    "pytz>=2025.1",
    "tabulate>=0.10",
]

[project.scripts]
netatmo-crontanamo = "somestuff.netatmostuff.Crontanamo:main"

[project.urls]
Homepage = "https://github.com/vroomfondel/somestuff"
Repository = "https://github.com/vroomfondel/somestuff"
Issues = "https://github.com/vroomfondel/somestuff/issues"

[tool.hatch.version]
path = "somestuff/netatmostuff/__init__.py"

# Build-level selection governs sdist AND wheel; a wheel-only `packages` leaves the sdist unscoped.
[tool.hatch.build]
packages = ["somestuff"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.local.*"]

[tool.hatch.build.targets.wheel]
exclude = ["**/*.local.*", "**/README.md", "**/*_deployment.yml", "**/*_cronjob.yml", "**/*.example", "**/*.example.yaml"]
