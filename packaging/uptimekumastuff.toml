[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somestuff-uptimekumastuff"
dynamic = ["version"]
description = "Uptime Kuma 2.x provisioning and migration: direct Socket.IO client with idempotent upserts, YAML → apply CLI, full export/import"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Henning Thieß", email = "ht@xomox.cc" }]
license-files = ["LICENSE.md"]
keywords = ["uptime-kuma", "monitoring", "provisioning", "socketio", "infrastructure-as-code", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "typer>=0.27",
    "python-socketio[client]>=5.17",
    "uptime-kuma-api>=1.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.2",
    "tabulate>=0.10",
]

[project.scripts]
uptimekuma-apply = "somestuff.uptimekumastuff.uptimekuma_apply:cli"
uptimekuma-simpleapi = "somestuff.uptimekumastuff.uptimekuma_simpleapi:app"

[project.urls]
Homepage = "https://github.com/vroomfondel/somestuff"
Repository = "https://github.com/vroomfondel/somestuff"
Issues = "https://github.com/vroomfondel/somestuff/issues"

[tool.hatch.version]
path = "somestuff/uptimekumastuff/__init__.py"

# Build-level selection governs sdist AND wheel; a wheel-only `packages` leaves the sdist unscoped.
[tool.hatch.build]
packages = ["somestuff"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
exclude = ["**/README.md", "**/*_deployment.yml", "**/*.example", "**/*.example.yaml", "somestuff/uptimekumastuff/uptimekuma_monitor.py"]
