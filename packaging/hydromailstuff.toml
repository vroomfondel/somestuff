[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somestuff-hydromailstuff"
dynamic = ["version"]
description = "Daily status email assembled from MQTT water-level readings and Netatmo rain/temperature data (Jinja2 template, SMTP via reputils)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Henning Thieß", email = "ht@xomox.cc" }]
license-files = ["LICENSE.md", "LICENSEGPL.md"]
keywords = ["netatmo", "mqtt", "email", "report", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Home Automation",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]
dependencies = [
    "somestuff-corestuff>=0.1.0",
    "somestuff-netatmostuff>=0.1.0",
    "loguru>=0.7.3",
    "jinja2>=3.1",
    "mqttstuff>=0.0.7",
    "reputils>=0.0.16",
    "tabulate>=0.10",
]

[project.scripts]
hydromail = "somestuff.hydromailstuff.hydromail:do_main_stuff"

[project.urls]
Homepage = "https://github.com/vroomfondel/somestuff"
Repository = "https://github.com/vroomfondel/somestuff"
Issues = "https://github.com/vroomfondel/somestuff/issues"

[tool.hatch.version]
path = "somestuff/hydromailstuff/__init__.py"

# Build-level selection governs sdist AND wheel; a wheel-only `packages` leaves the sdist unscoped.
[tool.hatch.build]
packages = ["somestuff"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.local.*"]

[tool.hatch.build.targets.wheel]
exclude = ["**/*.local.*", "**/README.md", "**/*_deployment.yml", "**/*_cronjob.yml", "**/*.example", "**/*.example.yaml"]
