[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somestuff-broadlinkstuff"
dynamic = ["version"]
description = "Broadlink RM4 IR/RF blaster tooling: device fleet without broadcast, IR/RF learning and sending, Coolix (Midea) climate codec, Typer CLI"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Henning Thieß", email = "ht@xomox.cc" }]
license-files = ["LICENSE.md"]
keywords = ["broadlink", "rm4", "infrared", "ir", "rf", "coolix", "midea", "air-conditioner", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3",
    "typer>=0.27",
    "broadlink>=0.19",
    "pydantic>=2.14",
    "ruamel.yaml>=0.19",
    "tabulate>=0.10",
]

[project.scripts]
broadlinkhelper = "somestuff.broadlinkstuff.broadlinkhelper:app"

[project.urls]
Homepage = "https://github.com/vroomfondel/somestuff"
Repository = "https://github.com/vroomfondel/somestuff"
Issues = "https://github.com/vroomfondel/somestuff/issues"

[tool.hatch.version]
path = "somestuff/broadlinkstuff/__init__.py"

# Build-level selection governs sdist AND wheel; a wheel-only `packages` leaves the sdist unscoped.
[tool.hatch.build]
packages = ["somestuff"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.local.*"]

[tool.hatch.build.targets.wheel]
exclude = ["**/*.local.*", "**/README.md", "**/*_deployment.yml", "**/*.example", "**/*.example.yaml"]
