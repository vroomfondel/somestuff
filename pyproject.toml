[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somestuff"
version = "0.1.2"
description = "Collection of Python utilities for IoT data aggregation, weather monitoring, and DNS automation."
requires-python = ">=3.13"
dynamic = ["dependencies"]
classifiers = ["Private :: Do Not Upload"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["Helper", "config"]

[tool.setuptools.packages.find]
# somestuff/ is a PEP 420 namespace (no __init__.py), so discovery needs namespaces = true
namespaces = true
include = ["somestuff*"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["somestuff"]
