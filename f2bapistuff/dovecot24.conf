# Dovecot 2.4 log format (log_path file, not syslog): stock dovecot.conf of fail2ban 1.1.0 only knows 2.3.

[Definition]

prefregex = ^\s*<F-CONTENT>.+</F-CONTENT>$

failregex = ^auth\(<F-USER>[^,()]*</F-USER>,<HOST>(?:,[^()]*)?\)(?:<[^>]*>)?: (?:Info: )?\S+: (?:[Uu]nknown user|[Pp]assword mismatch|[Ii]nvalid credentials)
            ^(?:pop3|imap|managesieve|submission)-login: (?:Info: )?(?:Login aborted|Disconnected)[^(]* \((?:auth failed, \d+ attempts(?: in \d+ secs)?|tried to use (?:disabled|disallowed) \S+ auth)\)(?: \([^)]*\))?: user=<<F-USER>[^>]*</F-USER>>,(?: method=\S+,)? rip=<HOST>

ignoreregex =

datepattern = {^LN-BEG}
