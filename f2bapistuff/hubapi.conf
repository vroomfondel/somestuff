# Bans go to the hub's ban API, which bans in its own fail2ban jail; nothing is blocked in the pod.
# Unbans only trigger f2b_hub_sync.py: the hub must keep an IP that another local jail (recidive) still bans.
# Actions run serially per jail: few retries, the periodic reconcile in f2b_hub_sync.py delivers what is missed.
[Definition]

actionstart =
actionstop =
actioncheck =

actionban = curl -fsS --max-time 10 --retry 2 --retry-delay 2 --retry-connrefused -H "Authorization: Bearer $(cat /etc/f2b-hub/token)" -H "Content-Type: application/json" -d '{"ip":"<ip>","jail":"<name>"}' "$(cat /etc/f2b-hub/url)/f2b/v1/ban"

actionunban = touch /run/f2b-hub-resync
